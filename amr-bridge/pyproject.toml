[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-telemetry-bridge"
version = "0.1.0"
description = "Pi → Supabase Realtime bridge for amrslam.tech/control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "supabase>=2.4.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
]

[project.scripts]
amr-telemetry-bridge = "amr_telemetry_bridge.bridge:main"

[tool.setuptools.packages.find]
include = ["amr_telemetry_bridge*"]
